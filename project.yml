name: QuickShow
options:
  bundleIdPrefix: cn.chiproad
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"

settings:
  base:
    PRODUCT_NAME: QuickShow
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "QuickShow Development"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: "wholemodule"
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: "all"
      LLVM_LTO: "YES"
      GCC_OPTIMIZATION_LEVEL: "s"
      CLANG_ENABLE_MODULE_DEBUGGING: NO

targets:
  QuickShow:
    type: application
    platform: macOS
    dependencies:
      - target: SwiftMath
      - target: HighlightrKit
    sources:
      - path: QuickShow
        excludes:
          - "Resources/MediaRemote"
      # mediaremote-adapter 以 folder reference 原样打进 bundle（保留 .framework 目录结构，
      # 运行时由 /usr/bin/perl 加载，不参与编译链接）
      - path: QuickShow/Resources/MediaRemote
        type: folder
        buildPhase: resources
      # SwiftMath vendoring：数学字体包以 folder reference 打进 App 资源
      - path: Vendor/SwiftMath/Sources/SwiftMath/mathFonts.bundle
        type: folder
        buildPhase: resources
      # Highlightr 资源：highlight.min.js 与主题 CSS 必须扁平压入 bundle 根
      # （无 type 的目录默认为 group，XcodeGen 会将目录内文件逐个加入 Copy Bundle
      #  Resources；Highlightr 运行期按 bundle 根扁平名查找 highlight.min.js 与 *.min.css）
      - path: Vendor/Highlightr/Resources/highlight.min.js
        buildPhase: resources
      - path: Vendor/Highlightr/Resources/styles
        buildPhase: resources
    info:
      path: QuickShow/Info.plist
      properties:
        # 版本号唯一真源在 project.yml：xcodegen 每次重写 Info.plist，手改 plist 会被打回默认 1.0
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: "1.13.0"
        CFBundleVersion: "1.13.0"
        LSUIElement: true
        CFBundleIdentifier: cn.chiproad.QuickShow
        CFBundleName: QuickShow
        CFBundleDisplayName: QuickShow
        NSBluetoothAlwaysUsageDescription: "QuickShow 需要蓝牙权限以检测已连接耳机与外设的电量状态。"
        NSCalendarsUsageDescription: "QuickShow 需要日历权限以在悬浮面板中向您展示即将到来的日程会议。"
        NSCalendarsFullAccessUsageDescription: "QuickShow 需要日历权限以在悬浮面板中向您展示即将到来的日程会议。"
        NSLocationWhenInUseUsageDescription: "QuickShow 需要定位权限以读取当前 Wi-Fi 名称 (SSID)，并为 AI 地图功能提供当前位置与附近搜索。"
        NSLocationAlwaysAndWhenInUseUsageDescription: "QuickShow 需要定位权限以读取当前 Wi-Fi 名称 (SSID)，并为 AI 地图功能提供当前位置与附近搜索。"
        NSLocationUsageDescription: "QuickShow 需要定位权限以读取当前 Wi-Fi 名称 (SSID)，并为 AI 地图功能提供当前位置与附近搜索。"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cn.chiproad.QuickShow
      PRODUCT_NAME: QuickShow
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: QuickShow/Info.plist
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "QuickShow Development"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      OTHER_LDFLAGS:
        - "-framework"
        - "Carbon"
        - "-framework"
        - "IOKit"
        - "-framework"
        - "CoreWLAN"
        - "-framework"
        - "CoreAudio"
        - "-framework"
        - "IOBluetooth"
        - "-framework"
        - "EventKit"
        - "-framework"
        - "CoreBluetooth"
        - "-framework"
        - "CoreLocation"
        - "-framework"
        - "MapKit"
        - "-framework"
        - "Network"

  # SwiftMath 1.7.3 vendored 静态库（本地 CJK 补丁说明见 Vendor/SwiftMath/Package.swift 头注释）
  SwiftMath:
    type: library.static
    platform: macOS
    sources:
      - path: Vendor/SwiftMath/Sources/SwiftMath
        excludes:
          - "mathFonts.bundle"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cn.chiproad.SwiftMath
      PRODUCT_NAME: SwiftMath
      PRODUCT_MODULE_NAME: SwiftMath
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "13.0"

  # Highlightr 2.x vendored 静态库（源码见 Vendor/Highlightr/，仅提供代码高亮能力）
  HighlightrKit:
    type: library.static
    platform: macOS
    sources:
      - path: Vendor/Highlightr/Sources/Highlightr
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cn.chiproad.HighlightrKit
      PRODUCT_NAME: HighlightrKit
      PRODUCT_MODULE_NAME: HighlightrKit
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
