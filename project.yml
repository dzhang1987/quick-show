name: QuickShow
options:
  bundleIdPrefix: cn.chiproad
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"

# SPM 依赖（与 targets 同级）：SwiftMath 提供数学公式排版渲染
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3

settings:
  base:
    PRODUCT_NAME: QuickShow
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "QuickShow Development"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: "wholemodule"
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: "all"
      LLVM_LTO: "YES"
      GCC_OPTIMIZATION_LEVEL: "s"
      CLANG_ENABLE_MODULE_DEBUGGING: NO

targets:
  QuickShow:
    type: application
    platform: macOS
    dependencies:
      - package: SwiftMath
    sources:
      - path: QuickShow
        excludes:
          - "Resources/MediaRemote"
      # mediaremote-adapter 以 folder reference 原样打进 bundle（保留 .framework 目录结构，
      # 运行时由 /usr/bin/perl 加载，不参与编译链接）
      - path: QuickShow/Resources/MediaRemote
        type: folder
        buildPhase: resources
    info:
      path: QuickShow/Info.plist
      properties:
        # 版本号唯一真源在 project.yml：xcodegen 每次重写 Info.plist，手改 plist 会被打回默认 1.0
        CFBundleShortVersionString: "1.8.0"
        CFBundleVersion: "1.8.0"
        LSUIElement: true
        CFBundleIdentifier: cn.chiproad.QuickShow
        CFBundleName: QuickShow
        CFBundleDisplayName: QuickShow
        NSBluetoothAlwaysUsageDescription: "QuickShow 需要蓝牙权限以检测已连接耳机与外设的电量状态。"
        NSCalendarsUsageDescription: "QuickShow 需要日历权限以在悬浮面板中向您展示即将到来的日程会议。"
        NSCalendarsFullAccessUsageDescription: "QuickShow 需要日历权限以在悬浮面板中向您展示即将到来的日程会议。"
        NSLocationWhenInUseUsageDescription: "QuickShow 需要定位权限以读取当前连接的 Wi-Fi 名称 (SSID)。"
        NSLocationAlwaysAndWhenInUseUsageDescription: "QuickShow 需要定位权限以读取当前连接的 Wi-Fi 名称 (SSID)。"
        NSLocationUsageDescription: "QuickShow 需要定位权限以读取当前连接的 Wi-Fi 名称 (SSID)。"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cn.chiproad.QuickShow
      PRODUCT_NAME: QuickShow
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: QuickShow/Info.plist
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "QuickShow Development"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      OTHER_LDFLAGS:
        - "-framework"
        - "Carbon"
        - "-framework"
        - "IOKit"
        - "-framework"
        - "CoreWLAN"
        - "-framework"
        - "CoreAudio"
        - "-framework"
        - "IOBluetooth"
        - "-framework"
        - "EventKit"
        - "-framework"
        - "CoreBluetooth"
        - "-framework"
        - "CoreLocation"
        - "-framework"
        - "Network"
