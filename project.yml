name: QuickShow
options:
  bundleIdPrefix: cn.chiproad
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"

settings:
  base:
    PRODUCT_NAME: QuickShow
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: "wholemodule"
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: "all"
      LLVM_LTO: "YES"
      GCC_OPTIMIZATION_LEVEL: "s"
      CLANG_ENABLE_MODULE_DEBUGGING: NO

targets:
  QuickShow:
    type: application
    platform: macOS
    sources:
      - path: QuickShow
    info:
      path: QuickShow/Info.plist
      properties:
        LSUIElement: true
        CFBundleIdentifier: cn.chiproad.QuickShow
        CFBundleName: QuickShow
        CFBundleDisplayName: QuickShow
        NSBluetoothAlwaysUsageDescription: "QuickShow 需要蓝牙权限以检测已连接耳机与外设的电量状态。"
        NSCalendarsUsageDescription: "QuickShow 需要日历权限以在悬浮面板中向您展示即将到来的日程会议。"
        NSCalendarsFullAccessUsageDescription: "QuickShow 需要日历权限以在悬浮面板中向您展示即将到来的日程会议。"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cn.chiproad.QuickShow
      PRODUCT_NAME: QuickShow
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: QuickShow/Info.plist
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      OTHER_LDFLAGS:
        - "-framework"
        - "Carbon"
        - "-framework"
        - "IOKit"
        - "-framework"
        - "CoreWLAN"
        - "-framework"
        - "CoreAudio"
        - "-framework"
        - "IOBluetooth"
        - "-framework"
        - "EventKit"
        - "-framework"
        - "CoreBluetooth"
